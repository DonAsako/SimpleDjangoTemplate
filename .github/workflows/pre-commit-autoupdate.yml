name: pre-commit autoupdate

# Dependabot does not manage `rev:` pins in .pre-commit-config.yaml, so this
# keeps the pinned hook revisions current on its own.
"on":
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    name: Update pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Update hook revisions
        run: uv run pre-commit autoupdate

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update pre-commit hook revisions"
          branch: chore/pre-commit-autoupdate
          delete-branch: true
          title: "chore: update pre-commit hook revisions"
          body: |
            Automated weekly `pre-commit autoupdate`.

            Review the bumped `rev:` pins in `.pre-commit-config.yaml`, then let
            CI run before merging.
